<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKS Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1F3A;--card:#12294a;--ink:#FAF6F0;--mute:#93a1b8;--line:#22395c;--acc:#E87722;--red:#ff8a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F3A;--card:#12294a;--ink:#FAF6F0;--mute:#93a1b8;--line:#22395c;--acc:#E87722;--red:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0B1F3A;--card:#12294a;--ink:#FAF6F0;--mute:#93a1b8;--line:#22395c;--acc:#E87722;--red:#ff8a7a}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;padding-bottom:96px}
header{padding:34px 20px 14px;max-width:1100px;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--acc)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(38px,9vw,68px);line-height:1;margin:10px 0 8px}
h1 i{color:var(--acc)}
.sub{color:var(--mute);font-size:14px;max-width:46ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;max-width:1100px;margin:auto;scrollbar-width:none}
.chip,.tier button{border:1px solid var(--line);background:none;color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;transition:.25s}
.chip.on,.tier button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;padding:18px 20px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;opacity:0;transform:translateY(18px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards;transition:transform .35s,border-color .3s,box-shadow .3s}
@keyframes in{to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.ph{aspect-ratio:1;overflow:hidden;background:#F4EFE6}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover img,.card.sel img{transform:scale(1.07)}
.tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#0B1F3A;display:grid;place-items:center;font-size:15px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.sel .tick{transform:scale(1)}
.num{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:99px}
.tx{padding:11px 12px 13px}
.tx b{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;display:block;line-height:1.15}
.tx small{color:var(--mute);font-size:11px;letter-spacing:.08em}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:6}
.foot div{flex:1;font-size:13px;color:var(--mute)}.foot strong{display:block;color:var(--ink);font-size:17px}
.btn{background:var(--acc);color:#0B1F3A;border:0;padding:12px 18px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.panel h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px}
.big{width:100%;border-radius:14px;margin:14px 0;max-height:46vh;object-fit:contain;background:#F4EFE6}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.row .g{flex:1;min-width:0}.row .g b{display:block;font-size:14px}.row .g span{font-size:12px;color:var(--mute)}
.row input{width:84px;padding:9px;border-radius:10px;border:1px solid var(--red);background:none;color:var(--red);font:inherit;font-weight:600;text-align:center}
.qa{width:90px;padding:8px;border-radius:99px;border:1px solid var(--acc);background:none;color:var(--ink);font:inherit;font-weight:600;text-align:center}
.row button{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.tier{display:flex;gap:8px;margin:14px 0;align-items:center;font-size:13px;color:var(--mute);flex-wrap:wrap}
.tot{display:flex;justify-content:space-between;padding:16px 0;font-size:15px}.tot b{font-size:22px;font-family:'Cormorant Garamond',serif}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--mute);padding:26px 0;text-align:center}
.q{background:#fff;color:#0B1F3A;border-radius:12px;padding:20px;font-size:12px}
.qh{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #E87722;padding-bottom:12px;flex-wrap:wrap}
.qh b{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1;display:block}.qh span{display:block;color:#6b7688;font-size:11px}
.qr{text-align:right}.qr strong{display:block;font-size:14px}
.qs{overflow-x:auto;margin-top:12px}.q table{width:100%;border-collapse:collapse;min-width:520px}
.q th{background:#0B1F3A;color:#fff;padding:7px 6px;font-size:11px}.q td{border-bottom:1px solid #e4dccd;padding:6px;text-align:center;vertical-align:middle}
.q .l{text-align:left}.q td img{width:46px;height:46px;object-fit:cover;border-radius:6px;display:block;margin:auto}.q em{color:#c0392b}
.qt{margin:12px 0 0 auto;max-width:260px}.qt p{display:flex;justify-content:space-between;padding:5px 0}.qt .g{border-top:2px solid #0B1F3A;font-weight:700;font-size:14px;color:#E87722}
.qm{color:#c0392b;margin-top:8px}.qn{color:#6b7688;margin-top:10px;font-size:11px}
@media print{body{background:#fff;padding:0}body>*:not(#sheet){display:none!important}.sheet{position:static;display:block!important;background:none}.panel{max-height:none;max-width:none;overflow:visible;animation:none;padding:0;background:#fff}.noprint{display:none!important}.q{padding:0}.q *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.tp{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.tp td{padding:4px 0;border-top:1px solid var(--line);color:var(--mute)}.tp td:last-child{text-align:right;color:var(--ink);font-weight:600}.tp tr:first-child td:last-child{color:var(--acc)}
.np{margin-top:8px;font-size:12px;color:var(--red)}.noimg{height:100%;display:grid;place-items:center;text-align:center;color:#6b7688;font-size:12px;padding:10px}.ni{font-size:10px;color:var(--mute)}
.tx b{font-size:17px}.grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}.panel .tp{max-width:320px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style></head><body>

try{const s=JSON.parse(localStorage.getItem('blackcol')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('blackcol',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),fmt=n=>'SAR '+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const TI=[[200,0],[500,.03],[1500,.07]],r2=n=>Math.round(n*100)/100,m2=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const BP=id=>{const x=D.find(z=>z.id==id);return x&&x.p?x.p:0};
const TP=(b,q)=>r2(b*(1-(q>=1500?.07:q>=500?.03:0)));
const P=id=>{const o=S.sel[id];if(o!==''&&o!=null&&+o>0)return +o;const b=BP(id);return b?TP(b,S.qty):0};
const LN={1:'List 1 · Current Collection · القائمة الأولى',2:'List 2 · Jad Proposal · القائمة الثانية'};
const IM=x=>x.img?`<img src="${x.img}" alt="${x.n}">`:'<div class="noimg">Image not available<br>الصورة غير متوفرة</div>';
const TB=x=>x.p?`<table class="tp">${TI.map(([q,d])=>`<tr><td>${q.toLocaleString('en')} pcs</td><td>SAR ${m2(r2(x.p*(1-d)))}</td></tr>`).join('')}</table>`:'<p class="np">Price not available · السعر غير متوفر</p>';
function chips(){$('chips').innerHTML=[1,2].map(c=>`<button class="chip ${c==S.list?'on':''}" data-c="${c}">${LN[c]} (${D.filter(x=>x.l==c).length})</button>`).join('')}
function grid(){const L=D.filter(x=>x.l==S.list);
$('grid').innerHTML=L.map((x,i)=>`<article class="card ${x.id in S.sel?'sel':''}" data-id="${x.id}" style="animation-delay:${i*45}ms"><div class="ph">${IM(x)}</div><span class="num">${String(x.sn).padStart(2,'0')}</span><span class="tick">✓</span><div class="tx"><b>${x.n}</b><small>${x.c||'&nbsp;'}</small>${TB(x)}</div></article>`).join('')}
function total(){return Object.entries(S.sel).reduce((a,[k,p])=>a+P(k)*S.qty,0)}
function foot(){const n=Object.keys(S.sel).length;$('cnt').textContent=n+' selected · '+S.qty+' pcs each';$('sum').textContent=fmt(total())}
function toggle(id){if(id in S.sel)delete S.sel[id];else S.sel[id]='';save();foot();document.querySelector(`[data-id="${id}"]`)?.classList.toggle('sel',id in S.sel)}
function detail(id){const x=D.find(d=>d.id==id);$('panel').innerHTML=`<div class="eyebrow">${LN[x.l]}${x.c?' · '+x.c:''}</div><h2>${x.n}</h2>${x.img?`<img class="big" src="${x.img}" alt="">`:'<p class="np">Image not available · الصورة غير متوفرة</p>'}<p class="sub">${x.d}</p>${TB(x)}<div class="acts" style="margin-top:16px"><button class="btn" data-t="${id}">${id in S.sel?'Remove from selection':'Add to selection'}</button><button class="btn ghost" data-x>Close</button></div>`;$('sheet').classList.add('open')}
function list(){const ids=Object.keys(S.sel);
$('panel').innerHTML=`<div class="eyebrow">Your selection · اختيارك</div><h2>${ids.length} pieces</h2><div class="tier">Quantity ${[200,500,1500].map(q=>`<button data-q="${q}" class="${q==S.qty?'on':''}">${q}</button>`).join('')}<input class="qa" inputmode="numeric" placeholder="Custom" value="${S.qty}" data-qa aria-label="Quantity for all"><span>applies to all · على الكل</span></div>`+
(ids.length?ids.map(id=>{const x=D.find(d=>d.id==id);return `<div class="row">${x.img?`<img src="${x.img}" alt="">`:'<span class="ni">No image</span>'}<div class="g"><b>${x.n}</b><span>${x.c||''}</span></div><input inputmode="decimal" placeholder="Price" value="${S.sel[id]||P(id)||''}" data-p="${id}"><button data-r="${id}" aria-label="Remove">×</button></div>`}).join(''):'<p class="empty">Nothing selected yet. Tap any piece to add it.</p>')+
`<div class="tot"><span id="tl">Total at ${S.qty} pcs each</span><b id="pt">${fmt(total())}</b></div><div class="acts"><button class="btn" data-quote>Generate quotation</button><button class="btn ghost" data-copy>Copy summary</button><button class="btn ghost" data-clear>Clear all</button><button class="btn ghost" data-x>Close</button></div>`;$('sheet').classList.add('open')}
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){S.list=+c;save();chips();grid()}};
let tm,lp;$('grid').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c)return;lp=false;tm=setTimeout(()=>{lp=true;detail(+c.dataset.id)},480)});
['pointerup','pointerleave','pointermove'].forEach(v=>$('grid').addEventListener(v,()=>clearTimeout(tm)));
$('grid').onclick=e=>{const c=e.target.closest('.card');if(c&&!lp)toggle(+c.dataset.id)};
$('grid').ondblclick=e=>{const c=e.target.closest('.card');if(c)detail(+c.dataset.id)};
$('grid').oncontextmenu=e=>e.preventDefault();
$('open').onclick=list;
function quote(){const ids=Object.keys(S.sel),dt=new Date(),p=n=>String(n).padStart(2,'0');
const no='OKS-Q-'+dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+'-'+p(dt.getHours())+p(dt.getMinutes());
const sub=total(),vat=sub*.15,miss=ids.filter(id=>!(P(id)>0)).length,m=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
$('panel').innerHTML=`<div class="q"><div class="qh"><div><b>OKS</b><span>Omar Ziyad Khairo Sindi Commercial Ltd. · Jeddah</span></div><div class="qr"><strong>Price Quotation · عرض سعر</strong><span>No. ${no}</span><span>Date: ${dt.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})}</span></div></div>
<div class="qs"><table><thead><tr><th>SN</th><th>Image</th><th class="l">Item</th><th>Code</th><th>Qty</th><th>Unit Price</th><th>Total (SAR)</th></tr></thead><tbody>${ids.map((id,i)=>{const x=D.find(z=>z.id==id),pr=P(id);return `<tr><td>${i+1}</td><td>${x.img?`<img src="${x.img}" alt="">`:'<span class="ni">No image</span>'}</td><td class="l"><b>${x.n}</b><br>${x.d}</td><td>${x.c||'-'}</td><td>${S.qty}</td><td>${pr?m(pr):'<em>missing</em>'}</td><td>${pr?m(pr*S.qty):'-'}</td></tr>`}).join('')}</tbody></table></div>
<div class="qt"><p><span>Subtotal</span><span>${m(sub)}</span></p><p><span>VAT 15%</span><span>${m(vat)}</span></p><p class="g"><span>Total (SAR)</span><span>${m(sub+vat)}</span></p></div>
${miss?`<p class="qm">${miss} item(s) have no price yet and are not included in the total.</p>`:''}
<p class="qn">Prices are per unit in SAR, excluding VAT. Quantity: ${S.qty} pcs per item.</p></div>
<div class="acts noprint" style="margin-top:16px"><button class="btn" data-print>Print / Save PDF</button><button class="btn ghost" data-back>Back</button><button class="btn ghost" data-x>Close</button></div>`}

$('sheet').onclick=e=>{const t=e.target,d=t.dataset;if(t.id=='sheet'||'x' in d){$('sheet').classList.remove('open');grid()}
else if(d.q){S.qty=+d.q;save();foot();list()}else if(d.r){toggle(+d.r);list()}else if(d.t){toggle(+d.t);$('sheet').classList.remove('open');grid()}
else if('quote' in d){quote()}else if('back' in d){list()}else if('print' in d){try{window.print()}catch(e){t.textContent='Print not available here'}}
else if('clear' in d){S.sel={};save();foot();list()}
else if('copy' in d){const txt=Object.keys(S.sel).map(id=>{const x=D.find(z=>z.id==id);return `${x.n}${x.c?' ('+x.c+')':''} x ${S.qty}${P(id)?' @ '+P(id)+' SAR':''}`}).join('\n')+'\nTotal: '+fmt(total());
(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>t.textContent='Copied ✓').catch(()=>{t.textContent='Copy not available here'})}};
$('sheet').oninput=e=>{if('qa' in e.target.dataset){S.qty=Math.max(0,parseInt(e.target.value)||0);save();foot();$('pt').textContent=fmt(total());$('tl').textContent='Total at '+S.qty+' pcs each';document.querySelectorAll('[data-p]').forEach(i=>{if(!S.sel[i.dataset.p])i.value=P(i.dataset.p)||''});document.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',+x.dataset.q==S.qty));return}const p=e.target.dataset.p;if(p){S.sel[p]=e.target.value;save();foot();$('pt').textContent=fmt(total())}};
chips();grid();foot();
</script></body></html>
